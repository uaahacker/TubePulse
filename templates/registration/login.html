{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TubePulse CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/login.css' %}">
</head>
<body class="login-shell">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="login-card card border-0 p-4 p-md-5" aria-labelledby="login-title">
      <div class="brand-mark mb-4" aria-hidden="true">TP</div>
      <p class="eyebrow mb-2">CREATOR OPERATING SYSTEM</p>
      <h1 id="login-title" class="h2 fw-bold mb-2">Welcome to TubePulse</h1>
      <p class="text-secondary mb-4">Turn live audience signals into publish-ready vertical videos.</p>
      {% if form.errors %}<div class="alert alert-danger">Your username or password was not recognized.</div>{% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input class="form-control form-control-lg" id="id_username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Password</label>
          <input class="form-control form-control-lg" type="password" id="id_password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Enter dashboard</button>
      </form>
    </section>
  </main>
</body>
</html>
